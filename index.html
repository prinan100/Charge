<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Charge Arch - Plug & Shoot</title>
    <!-- Tailwind CSS for UI controls -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #0f172a, #1e1b4b);
            width: 100%;
            height: 100%;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.8)); }
        }

        .plug-prompt {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        .hidden-modal {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center relative text-white bg-slate-950">

    <!-- HUD Overlay & Scoreboard -->
    <div class="absolute top-0 left-0 w-full p-3 flex justify-between items-start pointer-events-none z-10 gap-2">
        <div class="bg-slate-900/90 backdrop-blur border border-slate-700/60 rounded-xl p-2 px-3 flex items-center space-x-3 shadow-xl">
            <div>
                <div class="text-[9px] uppercase tracking-widest text-slate-400 font-bold">Developer</div>
                <div class="text-xs font-extrabold text-amber-400">Prinan</div>
            </div>
            <div class="h-6 w-px bg-slate-700/80"></div>
            <div>
                <div class="text-[9px] uppercase tracking-widest text-slate-400 font-bold">Score</div>
                <div id="scoreText" class="text-lg font-black text-amber-400">0</div>
            </div>
            <div class="h-6 w-px bg-slate-700/80"></div>
            <div>
                <div class="text-[9px] uppercase tracking-widest text-slate-400 font-bold">High Score</div>
                <div id="highScoreText" class="text-lg font-black text-slate-200">0</div>
            </div>
        </div>

        <!-- Charging & Power Meter Indicator -->
        <div class="bg-slate-900/90 backdrop-blur border border-slate-700/60 rounded-xl p-2 px-3 flex flex-col items-end shadow-xl max-w-[140px] shrink-0">
            <div class="flex items-center space-x-1.5 mb-1 w-full justify-end">
                <span id="chargeStatusText" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 truncate">UNPLUGGED</span>
                <div id="chargeIcon" class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse shrink-0"></div>
            </div>
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700">
                <div id="powerBar" class="h-full bg-gradient-to-r from-amber-500 to-yellow-300 w-0 transition-all duration-75"></div>
            </div>
        </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas" class="w-full h-full absolute inset-0 z-0"></canvas>

    <!-- Interactive Start / Game Over Modal -->
    <div id="instructionModal" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/95 backdrop-blur-md z-50 p-6 text-center">
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl shadow-2xl flex flex-col items-center">
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mb-4 plug-prompt">
                <svg class="w-8 h-8 sm:w-10 sm:h-10 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <h1 id="modalTitle" class="text-3xl sm:text-4xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-200 tracking-tight">CHARGE ARCH</h1>
            <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-4">By Prinan</p>
            <p id="modalDesc" class="text-slate-300 text-xs sm:text-sm mb-6 leading-relaxed">
                Plug in your charger (or hold the bottom button) to power up your bow. <strong class="text-amber-400">Unplug/release to fire!</strong> Defend against stick figures before they reach the red defense line.
            </p>
            
            <button id="startGameBtn" onclick="forceStartGame()" class="w-full py-4 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-extrabold rounded-2xl shadow-lg transition transform active:scale-95 text-base sm:text-lg cursor-pointer">
                TAP TO PLAY
            </button>
        </div>
    </div>

    <!-- Manual Simulator / Touch Controls -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-20 flex flex-col items-center space-y-2 w-full max-w-xs px-4">
        <button id="togglePlugBtn" class="w-full py-3 px-5 rounded-2xl font-bold bg-slate-800/90 border border-slate-700/80 hover:bg-slate-700/90 text-amber-400 backdrop-blur shadow-xl transition active:scale-95 flex items-center justify-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span id="toggleBtnText" class="text-xs sm:text-sm">HOLD / PLUG IN (SIMULATE)</span>
        </button>
        <span id="deviceTypeBadge" class="text-[10px] text-slate-400 bg-slate-900/80 px-3 py-1 rounded-full border border-slate-800">Mobile & Touch Ready</span>
    </div>

    <script>
        // Game State Variables
        let canvas, ctx;
        let isCharging = false;
        let isSimulatingCharging = false;
        let bowPower = 0;
        let score = 0;
        let highScore = 0;
        let gameRunning = false;
        let lastTime = performance.now();
        let spawnTimer = 0;
        let spawnInterval = 4200;

        let mouse = { x: 300, y: 300 };
        let arrows = [];
        let enemies = [];
        let particles = [];
        let archer = { x: 80, y: 300 };

        // DOM Element Cache
        let scoreText, highScoreText, chargeStatusText, chargeIcon, powerBar, instructionModal, startGameBtn, togglePlugBtn, toggleBtnText;

        function initDOM() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            scoreText = document.getElementById('scoreText');
            highScoreText = document.getElementById('highScoreText');
            chargeStatusText = document.getElementById('chargeStatusText');
            chargeIcon = document.getElementById('chargeIcon');
            powerBar = document.getElementById('powerBar');
            instructionModal = document.getElementById('instructionModal');
            startGameBtn = document.getElementById('startGameBtn');
            togglePlugBtn = document.getElementById('togglePlugBtn');
            toggleBtnText = document.getElementById('toggleBtnText');

            try {
                highScore = parseInt(localStorage.getItem('charge_arch_highscore') || '0', 10);
            } catch (e) { highScore = 0; }
            if (highScoreText) highScoreText.textContent = highScore;
        }

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth || document.documentElement.clientWidth || 360;
            canvas.height = window.innerHeight || document.documentElement.clientHeight || 640;
            archer.x = 80;
            archer.y = canvas.height / 2;
        }

        function forceStartGame() {
            initDOM();
            resizeCanvas();
            score = 0;
            bowPower = 0;
            arrows = [];
            enemies = [];
            particles = [];
            
            if (scoreText) scoreText.textContent = '0';
            
            if (instructionModal) {
                instructionModal.classList.add('hidden-modal');
            }

            gameRunning = true;
            lastTime = performance.now();
        }

        // Pointer Tracking
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, { passive: true });

        // Safe Battery Detection
        function initBatteryAPI() {
            try {
                if ('getBattery' in navigator && typeof navigator.getBattery === 'function') {
                    navigator.getBattery().then(battery => {
                        if (battery) {
                            updateBatteryStatus(battery.charging);
                            battery.addEventListener('chargingchange', () => {
                                updateBatteryStatus(battery.charging);
                            });
                        }
                    }).catch(() => {});
                }
            } catch (e) {}
        }

        function updateBatteryStatus(charging) {
            isCharging = !!charging;
            handleChargingChange();
        }

        function handleChargingChange() {
            const activeCharging = isCharging || isSimulatingCharging;
            
            if (activeCharging) {
                if (chargeStatusText) {
                    chargeStatusText.textContent = "CHARGING...";
                    chargeStatusText.className = "text-[10px] font-bold uppercase tracking-wider text-amber-400 truncate";
                }
                if (chargeIcon) chargeIcon.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping shrink-0";
                if (toggleBtnText) toggleBtnText.textContent = "RELEASE & SHOOT";
                if (togglePlugBtn) togglePlugBtn.classList.add("bg-amber-500/20", "border-amber-500/50");
            } else {
                if (chargeStatusText) {
                    chargeStatusText.textContent = "UNPLUGGED";
                    chargeStatusText.className = "text-[10px] font-bold uppercase tracking-wider text-slate-400 truncate";
                }
                if (chargeIcon) chargeIcon.className = "w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse shrink-0";
                if (toggleBtnText) toggleBtnText.textContent = "HOLD / PLUG IN (SIMULATE)";
                if (togglePlugBtn) togglePlugBtn.classList.remove("bg-amber-500/20", "border-amber-500/50");

                if (gameRunning && bowPower > 5) {
                    shootArrow(bowPower);
                }
                bowPower = 0;
            }
        }

        function startSimulatedCharge() {
            isSimulatingCharging = true;
            handleChargingChange();
        }

        function stopSimulatedCharge() {
            if (isSimulatingCharging) {
                isSimulatingCharging = false;
                handleChargingChange();
            }
        }

        // Setup Buttons
        function setupButtonEvents() {
            if (!togglePlugBtn) return;
            togglePlugBtn.addEventListener('mousedown', startSimulatedCharge);
            togglePlugBtn.addEventListener('mouseup', stopSimulatedCharge);
            togglePlugBtn.addEventListener('mouseleave', stopSimulatedCharge);
            togglePlugBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startSimulatedCharge();
            }, { passive: false });
            togglePlugBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                stopSimulatedCharge();
            }, { passive: false });
        }

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                if (!gameRunning) {
                    forceStartGame();
                } else {
                    startSimulatedCharge();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && gameRunning) {
                stopSimulatedCharge();
            }
        });

        // Game Entities
        function shootArrow(power) {
            const dx = mouse.x - archer.x;
            const dy = mouse.y - archer.y;
            const angle = Math.atan2(dy, dx);
            const speed = 14 + (power / 100) * 24;

            arrows.push({
                x: archer.x + Math.cos(angle) * 30,
                y: archer.y + Math.sin(angle) * 30,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                angle: angle,
                power: power,
                length: 50,
                trail: []
            });

            createParticles(archer.x, archer.y, 10, '#f59e0b');
        }

        function drawRealisticArrow(ctx, length, power) {
            ctx.strokeStyle = '#854d0e';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(-length, 0);
            ctx.lineTo(8, 0);
            ctx.stroke();

            ctx.strokeStyle = '#a16207';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-length + 5, 0);
            ctx.lineTo(5, 0);
            ctx.stroke();

            const fletchColor = power > 75 ? '#ef4444' : '#f8fafc';
            ctx.fillStyle = fletchColor;
            
            ctx.beginPath();
            ctx.moveTo(-length, 0);
            ctx.lineTo(-length + 14, -7);
            ctx.lineTo(-length + 22, 0);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-length, 0);
            ctx.lineTo(-length + 14, 7);
            ctx.lineTo(-length + 22, 0);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.moveTo(8, -6);
            ctx.lineTo(24, 0);
            ctx.lineTo(8, 6);
            ctx.lineTo(12, 0);
            ctx.closePath();
            ctx.fill();
        }

        class StickEnemy {
            constructor() {
                this.x = canvas.width + 30;
                this.y = Math.random() * (canvas.height - 180) + 90;
                this.speed = 0.12 + Math.random() * 0.15;
                this.height = 50 + Math.random() * 15;
                this.walkCycle = Math.random() * Math.PI * 2;
                this.hp = Math.random() > 0.9 ? 2 : 1;
                this.isBoss = this.hp > 1;
                this.color = this.isBoss ? '#ef4444' : '#f8fafc';
                this.scale = this.isBoss ? 1.3 : 1.0;
            }

            update() {
                this.x -= this.speed;
                this.walkCycle += 0.015;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3 * this.scale;
                ctx.lineCap = 'round';

                const h = this.height * this.scale;
                const legAngle = Math.sin(this.walkCycle) * 0.4;
                const armAngle = Math.cos(this.walkCycle) * 0.4;

                ctx.beginPath();
                ctx.arc(0, -h, 9 * this.scale, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -h + 9 * this.scale);
                ctx.lineTo(0, -h / 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -h / 2);
                ctx.lineTo(Math.sin(legAngle) * 12 * this.scale, 0);
                ctx.moveTo(0, -h / 2);
                ctx.lineTo(Math.sin(-legAngle) * 12 * this.scale, 0);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -h + 18 * this.scale);
                ctx.lineTo(Math.sin(armAngle) * 12 * this.scale, -h / 2 + 10);
                ctx.moveTo(0, -h + 18 * this.scale);
                ctx.lineTo(Math.sin(-armAngle) * 12 * this.scale, -h / 2 + 10);
                ctx.stroke();

                ctx.restore();
            }
        }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.04 + 0.02,
                    color: color,
                    size: Math.random() * 3.5 + 1.5
                });
            }
        }

        function updateGame(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            if (!gameRunning) return;

            const activeCharging = isCharging || isSimulatingCharging;
            if (activeCharging) {
                bowPower = Math.min(100, bowPower + deltaTime * 0.09);
            }
            if (powerBar) powerBar.style.width = `${bowPower}%`;

            if (enemies.length === 0) {
                spawnTimer += deltaTime;
                if (spawnTimer > spawnInterval) {
                    enemies.push(new StickEnemy());
                    spawnTimer = 0;
                }
            }

            for (let i = arrows.length - 1; i >= 0; i--) {
                const a = arrows[i];
                a.x += a.vx;
                a.y += a.vy;

                a.trail.push({ x: a.x, y: a.y });
                if (a.trail.length > 6) a.trail.shift();

                if (a.x > canvas.width + 100 || a.y < -50 || a.y > canvas.height + 50) {
                    arrows.splice(i, 1);
                    continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const dist = Math.hypot(a.x - e.x, a.y - (e.y - e.height / 2));

                    if (dist < 45 * e.scale) {
                        e.hp--;
                        createParticles(a.x, a.y, 10, e.color);

                        if (a.power < 60) {
                            arrows.splice(i, 1);
                        }

                        if (e.hp <= 0) {
                            enemies.splice(j, 1);
                            createParticles(e.x, e.y - e.height / 2, 20, '#fbbf24');
                            score += e.isBoss ? 3 : 1;
                            if (scoreText) scoreText.textContent = score;

                            if (score > highScore) {
                                highScore = score;
                                if (highScoreText) highScoreText.textContent = highScore;
                                try {
                                    localStorage.setItem('charge_arch_highscore', highScore);
