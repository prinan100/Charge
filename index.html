        // Resize Canvas dynamically

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            archer.y = canvas.height / 2;

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Track Pointer for Aiming
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }

        // Safe Non-Blocking Battery API Integration
        function initBatteryAPI() {
            try {
                if ('getBattery' in navigator && typeof navigator.getBattery === 'function') {
                    navigator.getBattery().then(battery => {
                        if (battery) {
                            updateBatteryStatus(battery.charging);
                            battery.addEventListener('chargingchange', () => {
                                updateBatteryStatus(battery.charging);
                            });
                        }
                    }).catch(err => {
                        console.warn('Battery API promise handled safely:', err);
                    });
                }
            } catch (e) {
                console.warn('Battery API initialization skipped safely:', e);
            }
        }

        function updateBatteryStatus(charging) {
            isCharging = !!charging;
            handleChargingChange();
        }

        function handleChargingChange() {
            const activeCharging = isCharging || isSimulatingCharging;
            
            if (activeCharging) {
                chargeStatusText.textContent = "CHARGING...";
                chargeStatusText.className = "text-[10px] sm:text-xs font-bold uppercase tracking-wider text-amber-400";

                togglePlugBtn.classList.add("bg-amber-500/20", "border-amber-500/50");
            } else {
                chargeStatusText.textContent = "UNPLUGGED";
                chargeStatusText.className = "text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-400";
                chargeIcon.className = "w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-red-500 animate-pulse shrink-0";
                toggleBtnText.textContent = "HOLD / PLUG IN (SIMULATE)";
                togglePlugBtn.classList.remove("bg-amber-500/20", "border-amber-500/50");

                // If unplugged and had power -> Shoot!
                if (gameRunning && bowPower > 5) {
                    shootArrow(bowPower);
                }
                bowPower = 0;
            }
        }

        // Auto-Detect Device Type
        function detectDeviceType() {
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            const userAgent = navigator.userAgent.toLowerCase();
            const isMobile = /iphone|ipad|ipod|android|blackberry|mini|windows\sce|palm/i.test(userAgent);

            if (isTouch && !isMobile && window.innerWidth > 1024) {
                deviceTypeBadge.textContent = "Smart Board Detected (Touch & Hold to Shoot)";

                deviceTypeBadge.textContent = "Mobile Mode (Plug/Unplug or Hold Button)";

                deviceTypeBadge.textContent = "Desktop Mode (Spacebar or Mouse to Shoot)";

        togglePlugBtn.addEventListener('mousedown', startSimulatedCharge);
        togglePlugBtn.addEventListener('mouseup', stopSimulatedCharge);

            e.preventDefault();
            startSimulatedCharge();
        }, { passive: false });
        togglePlugBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            stopSimulatedCharge();
        }, { passive: false });

        // Keyboard Spacebar Support
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat && gameRunning) {
                e.preventDefault();
                startSimulatedCharge();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && gameRunning) {

            const speed = 14 + (power / 100) * 24;

                vy: Math.sin(angle) * speed,
                angle: angle,
                power: power,
                length: 50,
                trail: []
            });

            createParticles(archer.x, archer.y, 10, '#f59e0b');
        }

            ctx.lineTo(24, 0);
            ctx.lineTo(8, 6);
            ctx.lineTo(12, 0);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#f1f5f9';
            ctx.beginPath();
            ctx.moveTo(10, -2);
            ctx.lineTo(22, 0);
            ctx.lineTo(12, 0);
            ctx.closePath();
            ctx.fill();
        }

        // --- Stick Figure Enemy Class ---
        class StickEnemy {
            constructor() {
                this.x = canvas.width + 30;
                this.y = Math.random() * (canvas.height - 180) + 90;
                this.speed = 0.12 + Math.random() * 0.15; // Slow movement speed
                this.height = 50 + Math.random() * 15;
                this.walkCycle = Math.random() * Math.PI * 2;
                this.hp = Math.random() > 0.9 ? 2 : 1;
                this.isBoss = this.hp > 1;
                this.color = this.isBoss ? '#ef4444' : '#f8fafc';
                this.scale = this.isBoss ? 1.3 : 1.0;
            }

            update(deltaTime) {
                this.x -= this.speed;
                this.walkCycle += 0.015;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;

                ctx.lineTo(Math.sin(-legAngle) * 12 * this.scale, 0);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -h + 18 * this.scale);
                ctx.lineTo(Math.sin(armAngle) * 12 * this.scale, -h / 2 + 10);
                ctx.moveTo(0, -h + 18 * this.scale);
                ctx.lineTo(Math.sin(-armAngle) * 12 * this.scale, -h / 2 + 10);
                ctx.stroke();

                ctx.restore();
            }
        }

        // --- Particle System ---
        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.04 + 0.02,
                    color: color,
                    size: Math.random() * 3.5 + 1.5
                });
            }
        }
