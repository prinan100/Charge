<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Charge Arch - Mobile Edition</title>
    <!-- Tailwind CSS for Mobile UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        html, body {
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background-color: #090d16;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.8)); }
        }

        .plug-prompt {
            animation: pulse-glow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center relative text-white bg-slate-950">

    <!-- Mobile Top HUD -->
    <div class="absolute top-0 left-0 w-full p-3 flex justify-between items-center pointer-events-none z-10 gap-2">
        <!-- Score Box -->
        <div class="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-2 px-3 flex items-center space-x-3 shadow-2xl">
            <div>
                <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Dev</div>
                <div class="text-xs font-black text-amber-400">Prinan</div>
            </div>
            <div class="h-6 w-px bg-slate-800"></div>
            <div>
                <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Score</div>
                <div id="scoreText" class="text-base font-black text-amber-400">0</div>
            </div>
            <div class="h-6 w-px bg-slate-800"></div>
            <div>
                <div class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">High</div>
                <div id="highScoreText" class="text-base font-black text-slate-200">0</div>
            </div>
        </div>

        <!-- Mobile Charger Status Indicator -->
        <div class="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-2 px-3 flex flex-col items-end shadow-2xl max-w-[130px] shrink-0">
            <div class="flex items-center space-x-1.5 mb-1 w-full justify-end">
                <span id="chargeStatusText" class="text-[9px] font-extrabold uppercase tracking-wider text-slate-400 truncate">UNPLUGGED</span>
                <div id="chargeIcon" class="w-2 h-2 rounded-full bg-red-500 animate-pulse shrink-0"></div>
            </div>
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700/50">
                <div id="powerBar" class="h-full bg-gradient-to-r from-amber-500 to-yellow-300 w-0 transition-all duration-75"></div>
            </div>
        </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas" class="w-full h-full absolute inset-0 z-0"></canvas>

    <!-- Mobile Start / Game Over Modal -->
    <div id="instructionModal" style="display: flex;" class="absolute inset-0 flex-col items-center justify-center bg-slate-950/95 backdrop-blur-md z-50 p-6 text-center">
        <div class="max-w-xs w-full bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl flex flex-col items-center">
            <div class="w-16 h-16 rounded-full bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mb-3 plug-prompt">
                <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <h1 id="modalTitle" class="text-3xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-200 tracking-tight">CHARGE ARCH</h1>
            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-3">Mobile Edition • By Prinan</p>
            <p id="modalDesc" class="text-slate-300 text-xs mb-5 leading-relaxed">
                Plug in your phone charger (or hold the bottom button) to power up your bow. <strong class="text-amber-400">Unplug/release to shoot!</strong> Stop stick figures before they reach the red defense line.
            </p>
            
            <button id="startGameBtn" class="w-full py-4 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-black rounded-2xl shadow-lg active:scale-95 transition text-base tracking-wide cursor-pointer">
                TAP TO PLAY
            </button>
        </div>
    </div>

    <!-- Mobile Bottom Controller -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-20 flex flex-col items-center w-full max-w-xs px-4">
        <button id="togglePlugBtn" class="w-full py-3.5 px-5 rounded-2xl font-black bg-slate-900/90 border border-slate-700 hover:bg-slate-800 text-amber-400 backdrop-blur shadow-2xl active:scale-95 transition flex items-center justify-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span id="toggleBtnText" class="text-xs font-bold tracking-wider">HOLD TO CHARGE</span>
        </button>
    </div>

    <script>
        // Game State Variables
        var canvas, ctx;
        var isCharging = false;
        var isSimulatingCharging = false;
        var bowPower = 0;
        var score = 0;
        var highScore = 0;
        var gameRunning = false;
        var lastTime = performance.now();
        var spawnTimer = 0;
        var spawnInterval = 4200;

        var touchTarget = { x: 300, y: 300 };
        var arrows = [];
        var enemies = [];
        var particles = [];
        var archer = { x: 70, y: 300 };

        // DOM Elements
        var scoreText, highScoreText, chargeStatusText, chargeIcon, powerBar, instructionModal, startGameBtn, togglePlugBtn, toggleBtnText;

        function forceStartGame() {
            gameRunning = true;
            score = 0;
            bowPower = 0;
            arrows = [];
            enemies = [];
            particles = [];
            spawnTimer = 0;
            
            if (scoreText) scoreText.textContent = '0';
            if (instructionModal) instructionModal.style.setProperty('display', 'none', 'important');

            resizeCanvas();
            lastTime = performance.now();
        }

        function initDOM() {
            canvas = document.getElementById('gameCanvas');
            if (canvas) ctx = canvas.getContext('2d');
            
            scoreText = document.getElementById('scoreText');
            highScoreText = document.getElementById('highScoreText');
            chargeStatusText = document.getElementById('chargeStatusText');
            chargeIcon = document.getElementById('chargeIcon');
            powerBar = document.getElementById('powerBar');
            instructionModal = document.getElementById('instructionModal');
            startGameBtn = document.getElementById('startGameBtn');
            togglePlugBtn = document.getElementById('togglePlugBtn');
            toggleBtnText = document.getElementById('toggleBtnText');

            try {
                highScore = parseInt(localStorage.getItem('charge_arch_highscore') || '0', 10);
            } catch (e) { highScore = 0; }
            if (highScoreText) highScoreText.textContent = highScore;
        }

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth || document.documentElement.clientWidth || 360;
            canvas.height = window.innerHeight || document.documentElement.clientHeight || 640;
            archer.x = 70;
            archer.y = canvas.height / 2;
        }

        // Mobile Touch Aiming Tracking
        window.addEventListener('touchstart', updateTouchPos, { passive: true });
        window.addEventListener('touchmove', updateTouchPos, { passive: true });
        
        function updateTouchPos(e) {
            if (e.touches && e.touches.length > 0) {
                touchTarget.x = e.touches[0].clientX;
                touchTarget.y = e.touches[0].clientY;
            }
        }

        // Mobile Battery API Listener
        function initMobileBattery() {
            try {
                if ('getBattery' in navigator && typeof navigator.getBattery === 'function') {
                    navigator.getBattery().then(function(battery) {
                        if (battery) {
                            updateBatteryState(battery.charging);
                            battery.addEventListener('chargingchange', function() {
                                updateBatteryState(battery.charging);
                            });
                        }
                    }).catch(function() {});
                }
            } catch (e) {}
        }

        function updateBatteryState(charging) {
            isCharging = !!charging;
            handleChargingChange();
        }

        function handleChargingChange() {
            var activeCharging = isCharging || isSimulatingCharging;
            
            if (activeCharging) {
                if (chargeStatusText) {
                    chargeStatusText.textContent = "CHARGING...";
                    chargeStatusText.className = "text-[9px] font-extrabold uppercase tracking-wider text-amber-400 truncate";
                }
                if (chargeIcon) chargeIcon.className = "w-2 h-2 rounded-full bg-amber-400 animate-ping shrink-0";
                if (toggleBtnText) toggleBtnText.textContent = "RELEASE TO SHOOT";
                if (togglePlugBtn) togglePlugBtn.classList.add("bg-amber-500/20", "border-amber-500/50");
            } else {
                if (chargeStatusText) {
                    chargeStatusText.textContent = "UNPLUGGED";
                    chargeStatusText.className = "text-[9px] font-extrabold uppercase tracking-wider text-slate-400 truncate";
                }
                if (chargeIcon) chargeIcon.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse shrink-0";
                if (toggleBtnText) toggleBtnText.textContent = "HOLD TO CHARGE";
                if (togglePlugBtn) togglePlugBtn.classList.remove("bg-amber-500/20", "border-amber-500/50");

                if (gameRunning && bowPower > 5) {
                    shootArrow(bowPower);
                }
                bowPower = 0;
            }
        }

        function startCharge() {
            isSimulatingCharging = true;
            handleChargingChange();
        }

        function stopCharge() {
            if (isSimulatingCharging) {
                isSimulatingCharging = false;
                handleChargingChange();
            }
        }

        function setupMobileTouchControls() {
            if (!togglePlugBtn) return;
            togglePlugBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                startCharge();
            }, { passive: false });
            togglePlugBtn.addEventListener('touchend', function(e) {
                e.preventDefault();
                stopCharge();
            }, { passive: false });
            togglePlugBtn.addEventListener('mousedown', startCharge);
            togglePlugBtn.addEventListener('mouseup', stopCharge);
        }

        function shootArrow(power) {
            var dx = touchTarget.x - archer.x;
            var dy = touchTarget.y - archer.y;
            var angle = Math.atan2(dy, dx);
            var speed = 14 + (power / 100) * 24;

            arrows.push({
                x: archer.x + Math.cos(angle) * 30,
                y: archer.y + Math.sin(angle) * 30,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                angle: angle,
                power: power,
                length: 48,
                trail: []
            });

            createParticles(archer.x, archer.y, 10, '#f59e0b');
        }

        function drawRealisticArrow(ctx, length, power) {
            ctx.strokeStyle = '#854d0e';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-length, 0);
            ctx.lineTo(8, 0);
            ctx.stroke();

            var fletchColor = power > 75 ? '#ef4444' : '#f8fafc';
            ctx.fillStyle = fletchColor;
            
            ctx.beginPath();
            ctx.moveTo(-length, 0);
            ctx.lineTo(-length + 12, -6);
            ctx.lineTo(-length + 18, 0);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-length, 0);
            ctx.lineTo(-length + 12, 6);
            ctx.lineTo(-length + 18, 0);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.moveTo(8, -5);
            ctx.lineTo(22, 0);
            ctx.lineTo(8, 5);
            ctx.lineTo(11, 0);
            ctx.closePath();
            ctx.fill();
        }

        function StickEnemy() {
            this.x = canvas.width + 30;
            this.y = Math.random() * (canvas.height - 180) + 90;
            this.speed = 0.12 + Math.random() * 0.15;
            this.height = 48 + Math.random() * 12;
            this.walkCycle = Math.random() * Math.PI * 2;
            this.hp = Math.random() > 0.9 ? 2 : 1;
            this.isBoss = this.hp > 1;
            this.color = this.isBoss ? '#ef4444' : '#f8fafc';
            this.scale = this.isBoss ? 1.3 : 1.0;

            this.update = function() {
                this.x -= this.speed;
                this.walkCycle += 0.015;
            };

            this.draw = function(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3 * this.scale;
                ctx.lineCap = 'round';

                var h = this.height * this.scale;
                var legAngle = Math.sin(this.walkCycle) * 0.4;
                var armAngle = Math.cos(this.walkCycle) * 0.4;

                ctx.beginPath();
                ctx.arc(0, -h, 8 * this.scale, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -h + 8 * this.scale);
                ctx.lineTo(0, -h / 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -h / 2);
                ctx.lineTo(Math.sin(legAngle) * 11 * this.scale, 0);
                ctx.moveTo(0, -h / 2);
                ctx.lineTo(Math.sin(-legAngle) * 11 * this.scale, 0);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -h + 16 * this.scale);
                ctx.lineTo(Math.sin(armAngle) * 11 * this.scale, -h / 2 + 8);
                ctx.moveTo(0, -h + 16 * this.scale);
                ctx.lineTo(Math.sin(-armAngle) * 11 * this.scale, -h / 2 + 8);
                ctx.stroke();

                ctx.restore();
            };
        }

        function createParticles(x, y, count, color) {
            for (var i = 0; i < count; i++) {
                var angle = Math.random() * Math.PI * 2;
                var speed = Math.random() * 4 + 1.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.04 + 0.02,
                    color: color,
                    size: Math.random() * 3 + 1.5
                });
            }
        }

        function updateGame(currentTime) {
            var deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            if (!gameRunning) return;

            var activeCharging = isCharging || isSimulatingCharging;
            if (activeCharging) {
                bowPower = Math.min(100, bowPower + deltaTime * 0.09);
            }
            if (powerBar) powerBar.style.width = bowPower + '%';

            if (enemies.length === 0) {
                spawnTimer += deltaTime;
                if (spawnTimer > spawnInterval) {
                    enemies.push(new StickEnemy());
                    spawnTimer = 0;
                }
            }

            for (var i = arrows.length - 1; i >= 0; i--) {
                var a = arrows[i];
                a.x += a.vx;
                a.y += a.vy;

                a.trail.push({ x: a.x, y: a.y });
                if (a.trail.length > 5) a.trail.shift();

                if (a.x > canvas.width + 100 || a.y < -50 || a.y > canvas.height + 50) {
                    arrows.splice(i, 1);
                    continue;
                }

                for (var j = enemies.length - 1; j >= 0; j--) {
                    var e = enemies[j];
                    var dist = Math.hypot(a.x - e.x, a.y - (e.y - e.height / 2));

                    if (dist < 42 * e.scale) {
                        e.hp--;
                        createParticles(a.x, a.y, 8, e.color);

                        if (a.power < 60) {
                            arrows.splice(i, 1);
                        }

                        if (e.hp <= 0) {
                            enemies.splice(j, 1);
                            createParticles(e.x, e.y - e.height / 2, 18, '#fbbf24');
                            score += e.isBoss ? 3 : 1;
                            if (scoreText) scoreText.textContent = score;

                            if (score > highScore) {
                                highScore = score;
                                if (highScoreText) highScoreText.textContent = highScore;
                                try {
                                    localStorage.setItem('charge_arch_highscore', highScore);
                                } catch (err) {}
                            }
                        }
                        break;
                    }
                }
            }

            var defenseLineX = archer.x + 55;
            for (var k = enemies.length - 1; k >= 0; k--) {
                var enemyObj = enemies[k];
                enemyObj.update();

                if (enemyObj.x <= defenseLineX) {
                    gameOver();
                    return;
                }
            }

            for (var pIdx = particles.length - 1; pIdx >= 0; pIdx--) {
                var p = particles[pIdx];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(pIdx, 1);
                }
            }
        }

        function renderGame() {
            if (!ctx || !canvas) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Defense Line
            var defenseLineX = archer.x + 55;
            ctx.save();
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(defenseLineX, 0);
            ctx.lineTo(defenseLineX, canvas.height);
            ctx.stroke();
            ctx.restore();

            var dx = touchTarget.x - ar
